<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Atlas Builder</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        padding: 20px;
      }

      h1 {
        font-size: 1.4em;
        margin-bottom: 4px;
        color: #fff;
      }

      .subtitle {
        font-size: 0.85em;
        color: #888;
        margin-bottom: 16px;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
        padding: 12px;
        background: #16213e;
        border-radius: 8px;
      }

      label {
        font-size: 0.85em;
        color: #aaa;
      }

      input[type="number"] {
        width: 60px;
        padding: 4px 6px;
        background: #0f3460;
        border: 1px solid #444;
        color: #fff;
        border-radius: 4px;
      }

      button {
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9em;
        background: #0f3460;
        color: #fff;
        transition: background 0.15s;
      }

      button:hover { background: #1a5276; }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button.primary {
        background: #27ae60;
      }

      button.primary:hover {
        background: #2ecc71;
      }

      #progress {
        width: 100%;
        height: 6px;
        background: #0f3460;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 16px;
        display: none;
      }

      #progressBar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3498db, #2ecc71);
        transition: width 0.1s;
      }

      #status {
        font-size: 0.85em;
        color: #aaa;
        margin-bottom: 12px;
        min-height: 1.2em;
      }

      .atlas-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .atlas-panel {
        flex: 1;
        min-width: 300px;
      }

      .atlas-panel h2 {
        font-size: 1em;
        margin-bottom: 8px;
        color: #ccc;
      }

      .atlas-container {
        position: relative;
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        border: 1px solid #333;
        border-radius: 4px;
        overflow: auto;
        max-height: 500px;

        /* Checkerboard so transparency is visible */
        background-color: #222;
        background-image:
          linear-gradient(45deg, #333 25%, transparent 25%),
          linear-gradient(-45deg, #333 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #333 75%),
          linear-gradient(-45deg, transparent 75%, #333 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }

      /* Updated to target images instead of canvas in the preview */
      .atlas-container img {
        display: block;
        image-rendering: pixelated;
      }

      .block-list {
        margin-top: 20px;
      }

      .block-list h2 {
        font-size: 1em;
        margin-bottom: 8px;
        color: #ccc;
      }

      .block-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8em;
      }

      .block-table th,
      .block-table td {
        padding: 4px 8px;
        border: 1px solid #333;
        text-align: left;
      }

      .block-table th {
        background: #16213e;
        color: #aaa;
        position: sticky;
        top: 0;
      }

      .block-table tr:hover {
        background: #16213e;
      }

      .block-table .err {
        color: #e74c3c;
      }

      .block-table .ok {
        color: #2ecc71;
      }
    </style>
  </head>

  <body>
    <h1>Atlas Builder</h1>

    <p class="subtitle">
      Composites individual block textures into atlas spritesheets.
      Run the Vite dev server first: <code>npm run dev</code>
    </p>

    <div class="toolbar">
      <label>
        Tile Size:
        <input type="number" id="tileSize" value="25" min="8" max="128" />
      </label>

      <label>
        Atlas Grid:
        <input type="number" id="atlasSize" value="16" min="2" max="256" />
      </label>

      <button type="button" id="buildBtn" class="primary" onclick="buildAtlas()">
        Build Atlas
      </button>

      <button type="button" id="dlDiffuse" onclick="download('diffuse')" disabled>
        Download Diffuse
      </button>

      <button type="button" id="dlNormal" onclick="download('normal')" disabled>
        Download Normal
      </button>
    </div>

    <div id="progress">
      <div id="progressBar"></div>
    </div>

    <div id="status"></div>

    <div class="atlas-row">
      <div class="atlas-panel">
        <h2>Diffuse Atlas</h2>
        <div class="atlas-container" id="diffuseContainer"></div>
      </div>

      <div class="atlas-panel">
        <h2>Normal Atlas</h2>
        <div class="atlas-container" id="normalContainer"></div>
      </div>
    </div>

    <div class="block-list">
      <h2>Block Tiles</h2>

      <div style="max-height:400px; overflow:auto; border:1px solid #333; border-radius:4px;">
        <table class="block-table" id="blockTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Col</th>
              <th>Row</th>
              <th>Diffuse</th>
              <th>Normal</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="block-list" id="mipPanel" style="display:none; border:2px solid #27ae60; border-radius:8px; padding:12px;">
      <h2>Mip Levels (CPU — alpha-weighted RGB + lerp-α 0.75)</h2>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:8px" id="mipContainer"></div>
    </div>

    <script>
      document.title = `Atlas Builder ${new Date().toLocaleTimeString()}`;

      const BLOCKS_URL = "/data/blocks.json";

      const CONCURRENT_LOADS = Math.min(
        32,
        Math.max(8, (navigator.hardwareConcurrency || 8) * 2)
      );

      const MAX_CANVAS_SIZE = 8192;

      let diffuseCanvas = null;
      let normalCanvas = null;
      let debugWorkCanvas = null;
      let debugTileSize = 25;
      let debugGridSize = 16;

      function getTexturePathFromFolder(folder, type = "diff", ext = ".png") {
        const base = folder.split("/").pop();
        if (!base) return null;

        const parts = base.split("_");
        const res = parts.length >= 2 ? `_${parts.pop()}` : "";
        const name = parts.join("_");

        return `${folder}/${name}_${type}${res}${ext}`;
      }

      async function loadImageFast(src) {
        if (!src) return null;

        try {
          const res = await fetch(src);
          if (!res.ok) return null;

          const blob = await res.blob();

          if ("createImageBitmap" in window) {
            return await createImageBitmap(blob);
          }

          const url = URL.createObjectURL(blob);
          const img = new Image();

          img.src = url;
          await img.decode();

          URL.revokeObjectURL(url);

          return img;
        } catch {
          return null;
        }
      }

      function makeCanvas(width, height) {
        if ("OffscreenCanvas" in window) {
          return new OffscreenCanvas(width, height);
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        return canvas;
      }

      function setStatus(msg) {
        document.getElementById("status").textContent = msg;
      }

      function setProgress(pct) {
        document.getElementById("progressBar").style.width = `${pct}%`;
      }

      // --- FIX #1: The Download Function ---
      function download(which) {
        const canvas = which === "diffuse" ? diffuseCanvas : normalCanvas;
        if (!canvas) return;
        
        const name = which === "diffuse" ? "diffuse_atlas.png" : "normal_atlas.png";
        const link = document.createElement("a");
        
        link.download = name;
        link.href = canvas.toDataURL("image/png");
        
        // Firefox strictly requires the link to be in the DOM to trigger a click
        document.body.appendChild(link);
        link.click();
        
        // Clean up immediately after clicking
        document.body.removeChild(link);
      }

      async function loadBatch(batch) {
        return Promise.all(
          batch.map(async (block) => {
            const diffusePath = getTexturePathFromFolder(block.path, "diff");
            const normalPath = getTexturePathFromFolder(block.path, "nor");

            const [diffuseImg, normalImg] = await Promise.all([
              loadImageFast(diffusePath),
              loadImageFast(normalPath)
            ]);

            return {
              id: block.id,
              name: block.name,
              diffuseImg,
              normalImg
            };
          })
        );
      }

      async function buildAtlas() {
        const tileSz = +document.getElementById("tileSize").value || 25;
        const gridSz = +document.getElementById("atlasSize").value || 16;
        const totalSize = tileSz * gridSz;

        if (totalSize > MAX_CANVAS_SIZE) {
          setStatus(`❌ Atlas too large: ${totalSize}x${totalSize}. Max is ${MAX_CANVAS_SIZE}x${MAX_CANVAS_SIZE}.`);
          return;
        }

        const buildBtn = document.getElementById("buildBtn");
        const dlDiffuse = document.getElementById("dlDiffuse");
        const dlNormal = document.getElementById("dlNormal");

        buildBtn.disabled = true;
        dlDiffuse.disabled = true;
        dlNormal.disabled = true;

        document.getElementById("progress").style.display = "block";

        setProgress(0);
        setStatus("Loading blocks...");

        document.querySelector("#blockTable tbody").innerHTML = "";
        document.getElementById("diffuseContainer").innerHTML = "";
        document.getElementById("normalContainer").innerHTML = "";

        let blocks;

        try {
          const res = await fetch(BLOCKS_URL);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          blocks = await res.json();
        } catch (e) {
          setStatus(`❌ Failed to load blocks.json. Use localhost/Vite. Error: ${e.message}`);
          buildBtn.disabled = false;
          return;
        }

        if (!Array.isArray(blocks)) {
          setStatus("❌ blocks.json is not an array.");
          buildBtn.disabled = false;
          return;
        }

        if (blocks.length > gridSz * gridSz) {
          setStatus(`❌ Atlas grid too small. ${blocks.length} blocks need more than ${gridSz}x${gridSz} slots.`);
          buildBtn.disabled = false;
          return;
        }

        setStatus("Creating atlas canvases...");

        const diffuseWorkCanvas = makeCanvas(totalSize, totalSize);
        const normalWorkCanvas = makeCanvas(totalSize, totalSize);

        const dctx = diffuseWorkCanvas.getContext("2d", { alpha: true });
        const nctx = normalWorkCanvas.getContext("2d", { alpha: true });

        dctx.imageSmoothingEnabled = true;
        nctx.imageSmoothingEnabled = true;

        dctx.clearRect(0, 0, totalSize, totalSize);
        nctx.clearRect(0, 0, totalSize, totalSize);

        const entries = [];
        let loaded = 0;

        setStatus(`Loading textures with concurrency ${CONCURRENT_LOADS}...`);

        for (let i = 0; i < blocks.length; i += CONCURRENT_LOADS) {
          const batch = blocks.slice(i, i + CONCURRENT_LOADS);
          const results = await loadBatch(batch);

          results.forEach((entry, j) => {
            const index = i + j;
            const col = index % gridSz;
            const row = Math.floor(index / gridSz);
            const x = col * tileSz;
            const y = row * tileSz;

            const hasDiffuse = !!entry.diffuseImg;
            const hasNormal = !!entry.normalImg;

            if (entry.diffuseImg) {
              dctx.drawImage(entry.diffuseImg, x, y, tileSz, tileSz);
              entry.diffuseImg.close?.();
              entry.diffuseImg = null;
            }

            if (entry.normalImg) {
              nctx.drawImage(entry.normalImg, x, y, tileSz, tileSz);
              entry.normalImg.close?.();
              entry.normalImg = null;
            }

            entries.push({
              id: entry.id,
              tileIndex: index,
              name: entry.name,
              col,
              row,
              hasDiffuse,
              hasNormal
            });
          });

          loaded += results.length;

          setProgress((loaded / blocks.length) * 85);
          setStatus(`Loading and drawing textures... ${loaded}/${blocks.length}`);

          await new Promise(requestAnimationFrame);
        }

        setStatus("Preparing preview...");
        setProgress(90);

        diffuseCanvas = convertToVisibleCanvas(diffuseWorkCanvas);
        normalCanvas = convertToVisibleCanvas(normalWorkCanvas);
        debugWorkCanvas = diffuseWorkCanvas;
        debugTileSize = tileSz;
        debugGridSize = gridSz;

        requestAnimationFrame(() => {
          // Pass the desired filename to the preview generator
          renderPreview("diffuseContainer", diffuseCanvas, "diffuse_atlas.png");
          renderPreview("normalContainer", normalCanvas, "normal_atlas.png");

          renderTable(entries);

          setProgress(100);
          setStatus(`✅ Done. ${entries.length} tiles composited into ${totalSize}x${totalSize} atlas.`);

          buildBtn.disabled = false;
          dlDiffuse.disabled = false;
          dlNormal.disabled = false;
        });
      }

      function convertToVisibleCanvas(source) {
        const canvas = document.createElement("canvas");
        canvas.width = source.width;
        canvas.height = source.height;

        const ctx = canvas.getContext("2d", { alpha: true });
        ctx.imageSmoothingEnabled = false;

        /* Keep background transparent */
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(source, 0, 0);

        return canvas;
      }

      // --- FIX #2: The Preview and Right-Click function ---
      function renderPreview(containerId, sourceCanvas, fileName) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";

        // Create an actual image tag. This allows proper "Right click -> Save Image As"
        const img = document.createElement("img");
        
        // Pass the full resolution data to the image
        img.src = sourceCanvas.toDataURL("image/png");
        
        // These properties instruct the browser on what to name it when right-clicked
        img.title = fileName; 
        img.alt = fileName;

        // Use CSS to visually scale the image down to a 400px preview while keeping the data full-res
        img.style.maxWidth = "100%";
        if (sourceCanvas.width > 400) {
            img.style.width = "400px";
        }
        img.style.height = "auto";
        img.style.imageRendering = "pixelated";
        
        // Optional: Wrap it in an anchor tag so clicking the preview ALSO downloads it
        const linkWrapper = document.createElement("a");
        linkWrapper.href = img.src;
        linkWrapper.download = fileName;
        linkWrapper.appendChild(img);

        container.appendChild(linkWrapper);
      }

      function renderTable(entries) {
        const tbody = document.querySelector("#blockTable tbody");
        let html = "";

        for (const entry of entries) {
          html += `
            <tr data-tile="${entry.tileIndex}" style="cursor:pointer">
              <td>${escapeHtml(entry.id)}</td>
              <td>${escapeHtml(entry.name)}</td>
              <td>${entry.col}</td>
              <td>${entry.row}</td>
              <td class="${entry.hasDiffuse ? "ok" : "err"}">${entry.hasDiffuse ? "OK" : "Missing"}</td>
              <td class="${entry.hasNormal ? "ok" : "err"}">${entry.hasNormal ? "OK" : "Missing"}</td>
            </tr>
          `;
        }

        tbody.innerHTML = html;

        // Click handler for mip preview
        tbody.querySelectorAll("tr[data-tile]").forEach(row => {
          row.addEventListener("click", () => {
            try {
              const tileIndex = +row.dataset.tile;
              const entry = entries.find(e => e.tileIndex === tileIndex);
              if (entry && entry.hasDiffuse) {
                setStatus(`Showing mip levels for tile index ${tileIndex} (${entry.id})...`);
                renderMipLevels(tileIndex, debugTileSize, debugGridSize);
              } else {
                setStatus(`❌ Tile index ${tileIndex} has no diffuse texture.`);
              }
            } catch (e) {
              setStatus(`❌ Error: ${e.message}`);
              console.error(e);
            }
          });
        });
      }

      // --- Mip debug -----------------------------------------------------------

      function fillTransparentPixels(data) {
        const n = data.length;
        for (let i = 0; i < n; i += 4) {
          if (data[i + 3] === 0) {
            data[i]     = 72;
            data[i + 1] = 99;
            data[i + 2] = 41;
          }
        }
      }

      function downsampleMip(src, w, h) {
        const nw = Math.max(1, w >> 1);
        const nh = Math.max(1, h >> 1);
        const dst = new Uint8ClampedArray(nw * nh * 4);

        for (let y = 0; y < nh; y++) {
          for (let x = 0; x < nw; x++) {
            let sumR = 0, sumG = 0, sumB = 0, sumA = 0;
            let maxA = 0, n = 0;

            for (let dy = 0; dy < 2; dy++) {
              for (let dx = 0; dx < 2; dx++) {
                const sx = x * 2 + dx;
                const sy = y * 2 + dy;
                if (sx >= w || sy >= h) continue;

                const si = (sy * w + sx) * 4;
                const a = src[si + 3];
                sumR += src[si]     * a;
                sumG += src[si + 1] * a;
                sumB += src[si + 2] * a;
                sumA += a;
                if (a > maxA) maxA = a;
                n++;
              }
            }

            const di = (y * nw + x) * 4;
            const inv = sumA > 0 ? 1 / sumA : 0;
            if (sumA > 0) {
              dst[di]     = (sumR * inv + 0.5) | 0;
              dst[di + 1] = (sumG * inv + 0.5) | 0;
              dst[di + 2] = (sumB * inv + 0.5) | 0;
            } else {
              dst[di]     = 72;
              dst[di + 1] = 99;
              dst[di + 2] = 41;
            }

            const avgA = sumA / n;
            dst[di + 3] = (avgA + (maxA - avgA) * 0.75 + 0.5) | 0;
          }
        }

        fillTransparentPixels(dst);

        return { data: dst, w: nw, h: nh };
      }

      function extractTile(src, srcW, tile, tx, ty) {
        const out = new Uint8ClampedArray(tile * tile * 4);
        for (let y = 0; y < tile; y++) {
          const si = ((ty * tile + y) * srcW + tx * tile) * 4;
          const di = y * tile * 4;
          for (let x = 0; x < tile; x++) {
            out[di + x * 4]     = src[si + x * 4];
            out[di + x * 4 + 1] = src[si + x * 4 + 1];
            out[di + x * 4 + 2] = src[si + x * 4 + 2];
            out[di + x * 4 + 3] = src[si + x * 4 + 3];
          }
        }
        return out;
      }

      function renderMipLevels(id, tile, grid) {
        try {
        const panel = document.getElementById("mipPanel");
        const container = document.getElementById("mipContainer");
        if (!panel || !container) { setStatus("❌ mipPanel or mipContainer not found"); return; }
        panel.style.display = "block";
        container.innerHTML = "<div style='color:#888;padding:8px'>Rendering…</div>";

        const tx = id % grid;
        const ty = (id / grid) | 0;

        // Read pixels from the diffuse work canvas
        const work = debugWorkCanvas;
        if (!work) { setStatus("❌ debugWorkCanvas is null — build atlas first"); return; }
        console.log("work canvas:", work.width, work.height);
        const ctx = work.getContext("2d");
        const imgData = ctx.getImageData(0, 0, work.width, work.height);
        console.log("imgData:", imgData.width, imgData.height, imgData.data.length);
        const src = imgData.data;
        const rawPixels = extractTile(src, work.width, tile, tx, ty);

        // Patch fully-transparent pixels with green — they're discarded
        // by the shader anyway, so this prevents black bleed in mip levels.
        const patched = new Uint8ClampedArray(rawPixels);
        fillTransparentPixels(patched);

        // Render two rows: raw and patched
        for (const [labelPrefix, pixels] of [["Raw", rawPixels], ["Patched", patched]]) {
          const labelRow = document.createElement("div");
          labelRow.style.width = "100%";
          labelRow.style.fontSize = "0.8em";
          labelRow.style.color = "#888";
          labelRow.style.marginTop = labelPrefix === "Patched" ? "12px" : "0";
          labelRow.textContent = labelPrefix === "Patched" ? "--- Patched (grass-green fill) ---" : "--- Raw atlas tile ---";
          container.appendChild(labelRow);

          let mw = tile, mh = tile;
          let px = new Uint8ClampedArray(pixels);
          const mipCount = Math.floor(Math.log2(Math.max(tile, tile))) + 1;
          console.log(`Mip count: ${mipCount}, tile: ${tile}x${tile}`);

          for (let mip = 0; mip < mipCount; mip++) {
            const c = document.createElement("canvas");
            c.width = mw;
            c.height = mh;
            const ctx = c.getContext("2d");
            const imgData = ctx.createImageData(mw, mh);
            imgData.data.set(px);
            ctx.putImageData(imgData, 0, 0);

            const wrapper = document.createElement("div");
            wrapper.style.textAlign = "center";
            wrapper.style.display = "inline-block";
            wrapper.style.marginRight = "8px";

            const img = document.createElement("img");
            img.src = c.toDataURL("image/png");
            img.style.imageRendering = "pixelated";
            img.style.width = Math.max(mw * 4, 20) + "px";
            img.style.height = Math.max(mh * 4, 20) + "px";
            img.style.border = "1px solid #555";
            wrapper.appendChild(img);

            const label2 = document.createElement("div");
            label2.style.fontSize = "0.75em";
            label2.style.color = "#aaa";
            label2.textContent = `LOD ${mip}  ${mw}×${mh}`;
            wrapper.appendChild(label2);

            container.appendChild(wrapper);
            console.log(`Appended LOD ${mip} canvas ${mw}x${mh}`);

            if (mip + 1 < mipCount) {
              const down = downsampleMip(px, mw, mh);
              px = down.data;
              mw = down.w;
              mh = down.h;
            }
          }
        }
          // Remove the "Rendering…" placeholder
          const placeholder = container.querySelector("div:first-child");
          if (placeholder && placeholder.textContent === "Rendering…") placeholder.remove();
          setStatus(`✅ Mip levels rendered for tile index ${id}.`);
          panel.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (e) { setStatus(`❌ renderMipLevels error: ${e.message}`); console.error(e); }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>

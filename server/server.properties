# b102 server configuration
# Format: key=value (same as Minecraft server.properties)

# ─── World ────────────────────────────────────────────────
# The seed used for terrain generation. All worlds use this
# seed unless overridden per-world in the URL.
seed=b102:overworld2

# ─── Network ──────────────────────────────────────────────
# Port the server listens on
server-port=2567
# Maximum number of simultaneous players
max-players=24
# Server name shown in logs
server-name=b102 Server
# Message of the day shown in the client's multiplayer server list.
# Supports plain text only (no markup). Edit and restart the server to apply.
server-motd=Welcome to b102: mine, build, survive.
# Protocol/version label surfaced to clients (optional, for compatibility UI).
server-version=0.0.1

# ─── Gameplay ─────────────────────────────────────────────
# Game mode for new players (survival, creative, adventure, spectator)
gamemode=creative
# Difficulty (peaceful, easy, normal, hard)
difficulty=normal
# Maximum block placement/break distance in blocks
max-reach=64

# ─── Performance ──────────────────────────────────────────
# Tick rate (ticks per second) for the simulation loop
tick-rate=20

# ─── World settings ───────────────────────────────────────
# Day/night cycle duration in milliseconds
day-duration=120000
# Enable the day/night cycle (true/false)
day-cycle=true

# ─── Performance ──────────────────────────────────────────
# Enable WASM SIMD noise acceleration for chunk generation (true/false).
# Requires src/code/wasm/kernels.wasm to exist. Falls back to JS if missing.
wasm-enabled=true

# ─── Storage ──────────────────────────────────────────────
# Where world data is stored (LevelDB directories per world)
world-storage-path=server-data
# Deserialized chunks kept in memory (LRU). Each cached chunk is roughly
# 32-64 KB, so 1024 entries is ~32-64 MB. Lower it to cap server memory.
chunk-cache-size=1024
